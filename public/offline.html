<!doctype html>
<!--
  Shown by public/sw.js when a page cannot load for want of a network. Plain
  HTML with its own styles, because it has to work with nothing else from the
  app available. Both languages, since it cannot know which the reader uses.
-->
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)" />
    <title>Ingen anslutning | Ekonomi</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f4f4f5;
        --fg: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --surface: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #17171a;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --border: #2e2e33;
          --surface: #1f1f23;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        background: var(--canvas);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
      }
      p {
        margin: 0 0 0.25rem;
        font-size: 0.875rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        height: 2.75rem;
        padding: 0 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ingen anslutning</h1>
      <p>Ekonomi behöver internet. Kontrollera din anslutning och försök igen.</p>
      <p lang="en">No connection. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Försök igen</button>
    </main>
  </body>
</html>
