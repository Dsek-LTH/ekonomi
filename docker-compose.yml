# Local development Postgres. Mirrors the self-hosted CloudNativePG target
# closely enough for app development. Production runs on the org's k8s cluster.
#
# Two ways to use this file:
#
#   pnpm db:up    postgres + minio only, and you run the app with `pnpm dev`.
#                 The everyday loop. Unchanged by the `app` profile below.
#   pnpm app:up   the whole stack, app included, built from the Dockerfile and
#                 run the way production runs it. Needs real values in .env —
#                 see "Running the whole stack in Docker" in the README.
services:
  postgres:
    image: postgres:16-alpine
    container_name: utlagg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: utlagg
      POSTGRES_PASSWORD: utlagg
      POSTGRES_DB: utlagg
    ports:
      - "5432:5432"
    volumes:
      - utlagg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utlagg -d utlagg"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for uploaded receipts (S3-compatible). Console at :9001.
  minio:
    image: minio/minio:latest
    container_name: utlagg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Read from .env so MinIO's credentials and the app's stay one setting.
      # The defaults are what lib/server/env.ts falls back to in development,
      # so an empty .env still gives you the same MinIO as before.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-utlagg}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-utlagg-dev-secret}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - utlagg-miniodata:/data

  # The intakt service: income reports from Zettle and Swish. Built from the
  # sibling Go module, and a separate container for one blunt reason — it
  # renders its PDFs with pdflatex, and a TeX installation has no business
  # inside the image that serves every page of the app.
  #
  # Not behind the `app` profile: `pnpm db:up` should bring up everything the
  # app is developed against, and this is one of those things.
  #
  # Its image is built once and then reused, so changing the Go source does
  # nothing until it is rebuilt: `pnpm intakt:build`.
  intakt:
    build:
      context: ./intakt
      target: runtime
    image: utlagg-intakt
    container_name: utlagg-intakt
    restart: unless-stopped
    # Named one by one rather than through env_file, so this container gets the
    # three things it needs and none of the app's secrets — it has no business
    # holding DATABASE_URL or the Fortnox credentials.
    #
    # These are interpolated from THIS directory's .env when the container is
    # *created*, not when it starts. A container created while a value was
    # missing keeps running with it empty, and the only sign is a line in its
    # log saying the Zettle endpoints are unavailable. After changing any of
    # them:
    #
    #   docker compose up -d --force-recreate intakt
    environment:
      # The app presents this as a bearer token. The default matches
      # .env.example so an empty .env still gives a working pair.
      INTAKT_TOKEN: ${INTAKT_TOKEN:-dev-only-insecure-intakt-token}
      # Zettle is optional — without it the service still imports Swish
      # exports and renders, and reports its Zettle endpoints unavailable.
      # Note these live in the *root* .env, which is the one compose reads;
      # intakt/.env is for running the CLI by hand from that directory.
      ZETTLE_CLIENT_ID: ${ZETTLE_CLIENT_ID:-}
      ZETTLE_API_KEY: ${ZETTLE_API_KEY:-}
    ports:
      # Published so `pnpm dev` on the host can reach it, which is the whole
      # point of it not being behind the profile.
      - "8080:8080"

  # ── The app itself, under the `app` profile ─────────────────────────
  # Behind a profile so `docker compose up` keeps meaning "the services I
  # develop against". Both services below only start with `--profile app`.

  # Brings the schema up to date, then exits. The app waits for it to succeed,
  # so a stack that starts is a stack whose database matches the code. Seeding
  # is deliberately not in this production migration image: it wipes domain
  # tables and needs application source, neither of which belongs in a deploy.
  migrate:
    build:
      context: .
      target: migrator
    image: utlagg-migrate
    profiles: ["app"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://utlagg:utlagg@postgres:5432/utlagg
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    image: utlagg-app
    container_name: utlagg-app
    profiles: ["app"]
    restart: unless-stopped
    # Everything the app reads comes from .env, exactly as it does under
    # `pnpm dev` — except the two addresses that are wrong inside the compose
    # network, which are overridden below. NODE_ENV is production here, so
    # lib/server/env.ts holds this to production rules: every required variable
    # has to be set, and there are no development fallbacks left to fall back
    # on. Whether a value is a *good* one is not checked and cannot be — see
    # the note on `envProblems` — so .env.example is what says what each should
    # be. A stack that exits immediately is that check talking; read it with
    # `docker compose --profile app logs app`.
    env_file:
      - path: .env
        required: false
    environment:
      # localhost inside a container is the container itself. These three are
      # the only settings that differ between `pnpm dev` and the stack —
      # everything else is whatever .env says, for both.
      DATABASE_URL: postgresql://utlagg:utlagg@postgres:5432/utlagg
      S3_ENDPOINT: http://minio:9000
      INTAKT_URL: http://intakt:8080
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      # Only started, not healthy: the app runs perfectly well while intakt is
      # still booting, and says the service is unavailable if asked before it
      # is. Waiting on it would make every stack start pay for a TeX container.
      intakt:
        condition: service_started

volumes:
  utlagg-pgdata:
  utlagg-miniodata:
