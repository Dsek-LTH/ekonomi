<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    A gold coin struck with D-sektionen's mark, in front of a stack of coins.
    Money first and the section second, because this is the section's
    economy app.

    No background tile, so it sits on whatever the tab strip is. The dark gold
    outline is what keeps it visible on white; on a dark strip the gold does
    that by itself. The mark is the accent pink (the color-accent token in globals.css) rather than
    the lighter brand pink, which nearly disappears on gold. The four bars are
    the same simplification of the ten stripes in public/symbol_rosa.svg.

    Laid out by numbers, not by eye: the group's bounding box is centred on
    the canvas with an even margin, and the mark's bounding box is centred on
    the coin face. One stroke weight throughout, about 1px at 32px, and light
    from the upper left, so every visible thickness is lower right.

    favicon.ico and apple-icon.png are rendered from this file. After changing
    it, regenerate both: 16, 32 and 48 for the .ico, and 180 for the Apple
    icon on white with the art inset, since iOS fills transparency with black
    and rounds the corners itself.
  -->
