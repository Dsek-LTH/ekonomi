  <!--
    D-sektionen's mark on a brand-pink tile, drawn for small sizes.

    A fill rather than the bare glyph, because a filled chip is what stays
    legible at 16px and it reads the same on a light and a dark tab strip. This
    is also what the direction contract in layout.tsx says pink is for.

    The bars are a deliberate simplification of the ten stripes in
    public/symbol_rosa.svg. At tab sizes the originals are sub-pixel.
